<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K9s - WebAssembly Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', 'Consolas', monospace;
            color: #00ff00;
            overflow: hidden;
        }
        
        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        #header {
            padding: 10px 20px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #444;
        }
        
        #header h1 {
            margin: 0;
            font-size: 24px;
            color: #00ff00;
        }
        
        #header p {
            margin: 5px 0 0 0;
            font-size: 12px;
            color: #888;
        }
        
        #terminal {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        #status {
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }
        
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #00ff00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            color: #ff4444;
        }
        
        .success {
            color: #00ff00;
        }
        
        #output {
            white-space: pre-wrap;
            font-family: inherit;
            background-color: #000;
            padding: 20px;
            margin: 20px;
            border-radius: 5px;
            overflow-y: auto;
            max-height: 70vh;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <h1>🐶 K9s - WebAssembly Demo</h1>
            <p>Browser-based Kubernetes cluster viewer with mock data</p>
        </div>
        <div id="terminal">
            <div id="status">
                <div class="spinner"></div>
                <p>Loading K9s WebAssembly module...</p>
                <p style="font-size: 11px; color: #666;">This demo runs entirely in your browser with mock Kubernetes data.</p>
            </div>
        </div>
        <div id="output" style="display: none;"></div>
    </div>

    <script src="wasm_exec.js"></script>
    <script src="main.js"></script>
</body>
</html>
